<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Simon Says Game</h1>
    <p>press any key to start the game</p>
    <div class="container">
      <div class="block01">
        <div type="button" class="btn pink"></div>
        <div type="button" class="btn orange"></div>
      </div>
      <div class="block02">
        <div type="button" class="btn cyan"></div>
        <div type="button" class="btn Periwinkle-Blue"></div>
      </div>
    </div>
    <br>
    <div class="score"></div>
  <script src="app.js"></script>
  </body>
</html>
