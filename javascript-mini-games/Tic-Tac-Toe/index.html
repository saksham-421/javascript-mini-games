<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        
        <title>Tic Tac Toe</title>
    </head>
    <body>
        <nav>
            <ul>
                <li>MyTicTacToe.com</li>
            </ul>
        </nav>
        <div class="gameContainer">
            <div class="container">
                <div class="line"></div>
                <div class="box bl bt"><span class="boxText"></span></div>
                <div class="box bl bt"><span class="boxText"></span></div>
                <div class="box bl bt br"><span class="boxText"></span></div>
                <div class="box bl bt"><span class="boxText"></span></div>
                <div class="box bl bt"><span class="boxText"></span></div>
                <div class="box bl bt br"><span class="boxText"></span></div>
                <div class="box bl bt bb"><span class="boxText"></span></div>
                <div class="box bl bt bb"><span class="boxText"></span></div>
                <div class="box bl bt br bb"><span class="boxText"></span></div>
            </div>
            <div class="gameInfo">
            <h1>Welcome to TicTacToe game</h1>
            <div>
                <span class="info">chance for </span>
                <button class="btn">Reset / Switch turn</button>
            </div>
            <div class="imgBox">
                <img src="excited.gif" alt="">
            </div>
        </div>
        </div>
        

    <script src="app.js"></script>
    </body>
</html>
